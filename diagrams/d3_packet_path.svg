5" style="font-family:'DejaVu Sans Mono',monospace">R  10.0.1.0     [120/1] via 192.168.10.249, Gi0/2</text><text x="84" y="510" font-size="14" fill="#E6EEF5" style="font-family:'DejaVu Sans Mono',monospace">R  10.0.0.0     [120/2] via 192.168.10.249, Gi0/2</text><rect x="820" y="370" width="720" height="160" rx="12" fill="#F4F8FC" stroke="#D5E1EC"/><text x="844" y="406" font-size="15" font-weight="700" fill="#0B2545" text-anchor="start" >How to read [120/3]:</text><text x="844" y="431" font-size="13.5" font-weight="500" fill="#1B2A3A" text-anchor="start" >120 = administrative distance (RIP); 3 = hop count to the destination.</text><text x="844" y="456" font-size="13.5" font-weight="500" fill="#1B2A3A" text-anchor="start" >Every remote prefix is learned via one next hop (.249), proving</text><text x="844" y="481" font-size="13.5" font-weight="500" fill="#1B2A3A" text-anchor="start" >RIPv2 carried classless /26, /24 and /30 routes across the WAN —</text><text x="844" y="506" font-size="13.5" font-weight="500" fill="#1B2A3A" text-anchor="start" >possible only because “no auto-summary” is configured on all four L3 nodes.</text></svg>